name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, types, unit tests, and package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      # The build above is required. npm test would build all packages again.
      - run: npx vitest run --maxWorkers=2
      # Checks all five publishable workspaces; never publishes a package.
      - run: npm run release:check

  browser:
    name: Chromium integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/apps/svelte/package-lock.json
            tests/apps/svelte-kit/package-lock.json
      - run: npm ci
      # The dock serves packages/client/dist, so build before starting fixtures.
      - run: npm run build
      - name: Install independent fixture dependencies
        run: |
          npm ci --prefix tests/apps/svelte
          npm ci --prefix tests/apps/svelte-kit
      - run: npx playwright install --with-deps chromium
      # Global setup starts plain Svelte on 5173 with a local test API token.
      # playwright.config.ts starts SvelteKit on 5174. Both use strict ports.
      - run: npm run test:e2e
      - name: Verify large-tree lifecycle and API sync
        run: node scripts/verify-stress.mjs
      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
